name: Sync Hugging Face Documents and Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify Hugging Face document repository
        run: |
          python scripts/sync_huggingface.py \
            --root . \
            --repo-id "angatupyrytau/jem" \
            --revision "main"

      # Se prueba el validador antes de confiar en él. Sin esto, un validador
      # que dejara de comprobar seguiría dando verde y nadie lo notaría: es
      # exactamente como convivieron siete rutas declaradas inexistentes con
      # el CI en verde.
      - name: Test the validator (negative tests)
        run: python scripts/probar_validador.py .

      - name: Validate Web6 and local JEM Silver
        run: python scripts/validate_web6.py . --verbose

      # Los dos pasos de arriba miran archivos. Ninguno detecta que el
      # JavaScript falle al ejecutarse, y eso ya se publicó: una llamada a una
      # función que no existía hacía que la cola de revisión pintara la reserva
      # en inglés, con los cuatro contadores en «—», durante días y con el CI
      # en verde. Este paso abre la página en un navegador real.
      - name: Install browser for the rendering test
        run: python -m playwright install --with-deps chromium

      - name: Test that the page actually renders
        run: python scripts/probar_pagina.py .

      # El buscador de voto tiene su propia prueba: comprueba que los
      # recuentos que muestra coincidan con lo que da la base, no sólo
      # que la tabla se pinte.
      - name: Test the vote search page
        run: python scripts/probar_buscador_voto.py .

      - name: Generate integrity manifest
        run: python scripts/generar_manifest_integridad.py .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          # TODAS las páginas del repositorio, no una lista escrita a mano.
          # La lista fija dejó fuera buscador-voto.html: su JavaScript, su
          # Parquet y su entrada en el menú se publicaron, y la página daba 404.
          cp *.html .nojekyll MANIFEST.sha256 _site/
          # Metadatos legibles por máquina y marco de gobernanza. Sin
          # desplegarlos, un marco que nadie puede leer no gobierna nada y
          # unos metadatos que no se sirven no describen nada.
          cp ro-crate-metadata.json codemeta.json CITATION.cff CNAME _site/
          # favicon.ico va en la raíz porque es donde lo pide el navegador
          # cuando no encuentra una declaración; el manifiesto, por la misma razón.
          cp favicon.ico site.webmanifest _site/
          cp -r assets data gobernanza _site/

      - name: Check that every page made it into the build
        shell: bash
        run: |
          faltan=0
          for f in *.html; do
            if [ ! -f "_site/$f" ]; then echo "FALTA en _site: $f"; faltan=1; fi
          done
          for d in assets data gobernanza; do
            if [ ! -d "_site/$d" ]; then echo "FALTA en _site: $d/"; faltan=1; fi
          done
          [ "$faltan" = "0" ] && echo "OK: $(ls _site/*.html | wc -l) páginas en el sitio construido"
          exit $faltan

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
